<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JM Stands — Links</title>
  <meta name="description" content="Solicite o projeto do seu stand, fale com a JM no WhatsApp e conheça nossos trabalhos.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111111">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="JM Stands — Projeto, produção e montagem de stands">
  <meta property="og:description" content="Solicite o projeto do seu stand ou fale com a JM no WhatsApp.">
  <meta property="og:image" content="https://www.jmstandspr.com.br/assets/img/og-image.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bio">
<!-- Página para a bio do Instagram: publique e use o endereço .../links -->
<main class="bio-shell">
  <button class="bio-share" type="button" data-bio-share aria-label="Compartilhar esta página" title="Compartilhar esta página">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.3M8.7 13.3l6.6 4.3"/></svg>
  </button>

  <header class="bio-head">
    <a class="bio-avatar" href="index.html?origem=instagram" aria-label="Acessar o site da JM Stands">
      <img src="assets/img/logo/logo1.png" alt="">
    </a>
    <h1>JM Stands</h1>
    <p>Projeto, produção e montagem de stands.</p>
    <span class="bio-status"><i aria-hidden="true"></i> Atendimento em todo o Brasil</span>
  </header>

  <nav class="bio-links" aria-label="Canais e páginas da JM Stands">
    <a class="bio-link bio-link-primary" href="index.html?origem=instagram#solicitar">
      <span class="bio-link-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></span>
      <span class="bio-link-copy"><b>Solicitar orçamento</b><small>Conte sobre o seu evento</small></span>
      <span class="bio-link-arrow" aria-hidden="true">→</span>
    </a>

    <a class="bio-link" data-bio-wa href="#" target="_blank" rel="noopener">
      <span class="bio-link-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 21l1.65-4.8A9 9 0 1 1 7.8 19.35z"/><path d="M8.8 8.2c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.8 1.9c.1.3.1.5-.1.7l-.6.7c-.2.2-.1.4 0 .6.5.9 1.2 1.6 2.1 2.1.2.1.4.2.6 0l.8-1c.2-.2.4-.3.7-.1l1.8.8c.3.1.4.3.4.5 0 .4-.2 1.3-.8 1.8-.5.5-1.2.8-2 .7-1.2-.2-2.8-.8-4.5-2.3-2-1.8-3.1-4-3.2-5.1 0-.5.1-.9.3-1.3z"/></svg></span>
      <span class="bio-link-copy"><b>Falar no WhatsApp</b><small>Atendimento comercial</small></span>
      <span class="bio-link-arrow" aria-hidden="true">↗</span>
    </a>

    <a class="bio-link" href="projetos.html?origem=instagram">
      <span class="bio-link-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
      <span class="bio-link-copy"><b>Ver projetos</b><small>Stands e cenografias realizadas</small></span>
      <span class="bio-link-arrow" aria-hidden="true">→</span>
    </a>

    <a class="bio-link" href="index.html?origem=instagram">
      <span class="bio-link-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-7h6v7"/></svg></span>
      <span class="bio-link-copy"><b>Conhecer a JM</b><small>Serviços, processo e estrutura</small></span>
      <span class="bio-link-arrow" aria-hidden="true">→</span>
    </a>
  </nav>

  <div class="bio-social" aria-label="Outros canais da JM Stands">
    <a data-bio-instagram href="#" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></a>
    <a data-bio-mail href="#" aria-label="E-mail"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></a>
    <a href="index.html?origem=instagram" aria-label="Site da JM Stands"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></a>
  </div>

  <footer class="bio-foot">
    <span>JM Stands · Colombo, PR</span>
    <a href="privacidade.html">Privacidade</a>
  </footer>
  <span class="sr-only" data-share-status aria-live="polite"></span>
</main>

<script src="js/config.js"></script>
<script>
  (() => {
    const S = window.SITE;
    const wa = document.querySelector('[data-bio-wa]');
    wa.href = 'https://wa.me/' + S.whatsapp + '?text=' + encodeURIComponent('Olá, JM! Vim pelo Instagram e gostaria de conversar sobre um projeto de stand.');
    document.querySelector('[data-bio-mail]').href = 'mailto:' + S.email;
    const instagram = document.querySelector('[data-bio-instagram]');
    if (S.social.instagram) instagram.href = S.social.instagram;
    else instagram.hidden = true;

    const share = document.querySelector('[data-bio-share]');
    const shareStatus = document.querySelector('[data-share-status]');
    share.addEventListener('click', async () => {
      const data = { title: 'JM Stands', text: 'Projeto, produção e montagem de stands.', url: location.href };
      try {
        if (navigator.share) await navigator.share(data);
        else {
          await navigator.clipboard.writeText(location.href);
          shareStatus.textContent = 'Link copiado.';
          share.classList.add('copied');
          setTimeout(() => share.classList.remove('copied'), 1600);
        }
      } catch (error) {
        if (error.name !== 'AbortError') shareStatus.textContent = 'Não foi possível compartilhar o link.';
      }
    });
  })();
</script>
</body>
</html>
