# ==========================================================================
# Painel de conteúdo da JM Stands — https://SEU-SITE/admin/
# Cada "Salvar" vira um commit no GitHub e a Netlify publica o site sozinha.
# Documentação: https://sveltiacms.app/en/docs
# ==========================================================================

backend:
  name: github
  repo: Lipepimenta/Stands
  branch: main
  commit_messages:
    create: 'Painel: cria {{collection}} "{{slug}}"'
    update: 'Painel: atualiza {{collection}} "{{slug}}"'
    delete: 'Painel: remove {{collection}} "{{slug}}"'
    uploadMedia: 'Painel: envia "{{path}}"'
    deleteMedia: 'Painel: remove "{{path}}"'

site_url: https://www.jmstandspr.com.br
display_url: https://www.jmstandspr.com.br
logo_url: /assets/img/logo/logo1.png

# Pasta padrão das fotos enviadas pelo painel
media_folder: /assets/img/projetos
public_folder: /assets/img/projetos

# As fotos são reduzidas e convertidas para WebP no navegador, antes de enviar.
# Pode mandar a foto original do celular (inclusive HEIC do iPhone).
# 1600 px / qualidade 78 ≈ 140 KB por foto: o GitHub corta salvamentos que demoram
# mais de ~5 s para subir, então fotos leves permitem mais fotos por salvamento.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 78
        width: 1600
        height: 1600
      svg:
        optimize: true

collections:
  - name: site
    label: Página inicial
    icon: home
    files:
      - name: home
        label: Fotos da página inicial
        icon: home
        file: content/home.json
        media_folder: /assets/img/home
        public_folder: /assets/img/home
        fields:
          - name: hero
            label: Foto de abertura (topo do site)
            widget: image
            required: false
            hint: 'Foto grande do topo, atrás do título. Prefira uma foto larga e mais escura, e que não seja capa de projeto da home. Dá para escolher uma já enviada.'
          - name: heroAlt
            label: Descrição da foto de abertura
            widget: string
            required: false
            hint: 'Para acessibilidade e Google. Ex.: Stand da Autolac com arco de LED'
          - name: estrutura
            label: Fotos da seção Estrutura (oficina, marcenaria, montagem)
            widget: image
            multiple: true
            required: false
            max: 3
            hint: 'Exatamente 3 fotos: a 1ª fica grande, as outras duas ao lado. Enquanto não houver 3, a seção mostra só o texto.'

  - name: portfolio
    label: Portfólio
    icon: photo_library
    files:
      - name: projetos
        label: Projetos
        icon: photo_library
        file: content/projetos.json
        fields:
          - name: projects
            label: Projetos
            label_singular: Projeto
            widget: list
            root: true
            required: false
            add_to_top: true
            collapsed: true
            summary: '{{fields.title}}'
            fields:
              - name: title
                label: Nome do projeto
                widget: string
                hint: 'Ex.: Stand de lançamento, Stand ilha com lounge…'
              - name: images
                label: Fotos
                widget: image
                multiple: true
                min: 1
                hint: 'Arraste as fotos (a primeira é a capa; dá para reordenar). Não precisa reduzir nem converter. Se der erro ao salvar, salve de 3 em 3 fotos ou use o robô para muitas fotos.'
              - name: client
                label: Cliente
                widget: string
                required: false
                hint: 'Só coloque o nome se o cliente autorizar.'
              - name: event
                label: Feira ou evento
                widget: string
                required: false
                hint: 'Ex.: Expotrade, APAS Show, Feira Construir…'
              - name: year
                label: Ano
                widget: number
                value_type: int
                min: 2000
                max: 2100
                required: false
              - name: city
                label: Cidade
                widget: string
                required: false
              - name: state
                label: Estado (UF)
                widget: select
                required: false
                options: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
              - name: area
                label: Metragem
                widget: string
                required: false
                hint: 'Ex.: 60 m²'
              - name: format
                label: Formato do espaço
                widget: select
                required: false
                options: [Ilha, Esquina, Península, Linear]
              - name: build
                label: Tipo de construção
                widget: select
                required: false
                options: [Construído, Misto, Octanorm, Cenografia]
              - name: summary
                label: Resumo
                widget: text
                required: false
                hint: 'Opcional. Uma ou duas frases: o desafio e a solução.'
              - name: home
                label: Onde aparece na página inicial
                widget: select
                required: false
                default: ''
                options:
                  - { label: 'Não aparece (só no Portfólio)', value: '' }
                  - { label: 'Faixa logo abaixo da abertura (até 3)', value: 'faixa' }
                  - { label: 'Seção Destaques (até 4)', value: 'destaque' }
                hint: 'Um projeto aparece em um só lugar da home. Todos aparecem no Portfólio.'
              - name: hidden
                label: Ocultar do site
                widget: boolean
                default: false
                hint: 'Use para guardar um projeto como rascunho.'

      - name: clientes
        label: Marcas atendidas (logos)
        icon: verified
        file: content/clientes.json
        media_folder: /assets/img/clientes
        public_folder: /assets/img/clientes
        fields:
          - name: clients
            label: Marcas
            label_singular: Marca
            widget: list
            root: true
            required: false
            summary: '{{fields.name}}'
            fields:
              - name: name
                label: Nome da marca
                widget: string
              - name: logo
                label: Logo
                widget: image
                required: false
                hint: 'De preferência PNG com fundo transparente ou SVG. Só com autorização da marca.'
