<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel JM Stands</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap">
  <link rel="stylesheet" href="painel.css">
  <!-- Aplica o tema antes de desenhar a página (evita piscar claro/escuro) -->
  <script>
    (() => {
      let pref = 'auto';
      try { pref = localStorage.getItem('jm-painel-tema') || 'auto'; } catch (e) {}
      const dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <!-- Painel de conteúdo da JM: projetos, fotos da página inicial e logos (grava no GitHub). Lógica em painel.js. -->
  <div id="app"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="painel.js"></script>
</body>
</html>
